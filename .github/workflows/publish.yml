name: Test, package and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: git-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e 'const expected = "v" + require("./package.json").version; if (process.env.GITHUB_REF_NAME !== expected) { console.error("Tag must equal " + expected); process.exit(1); }'
      - run: npm run package -- --out git-daily.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: git-daily-vsix
          path: git-daily.vsix
          if-no-files-found: error
          retention-days: 30

  publish:
    # Normal pushes, pull requests and manual builds never publish.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: git-daily-vsix
          path: dist
      - name: Publish tested package to Visual Studio Marketplace
        run: npx --no-install vsce publish --oidc --packagePath dist/git-daily.vsix
